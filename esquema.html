<!DOCTYPE html>
<html>
<head>
    <title>Minha Rede Social</title>
    <style>
        body {
            background: #eee;
            font-family: Arial;
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .esquerda, .meio, .direita {
            background: white;
            padding: 15px;
            border-radius: 10px;
        }

        .esquerda {
            width: 25%;
        }

        .meio {
            width: 50%;
        }

        .direita {
            width: 25%;
        }

        img {
            width: 100%;
            border-radius: 10px;
        }

        button {
            padding: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="esquerda">
        <h2>Meu Perfil</h2>
        <img src="https://placehold.co/300x120">
        <h3>Luana</h3>
        <p>Olá! Bem-vindo ao meu perfil.</p>
        <p>🟢 Online</p>
        <p>Estudante de programação</p>
    </div>

    <div class="meio">
        <h2>Postagens</h2>

        <h3>Minha primeira postagem</h3>
        <p>Hoje estou aprendendo a criar uma rede social!</p>

        <button onclick="alert('Você curtiu!')">
            ❤️ Curtir
        </button>

        <button onclick="alert('Área de comentários!')">
            💬 Comentar
        </button>

        <hr>

        <h3>Outra postagem</h3>
        <p>Seja bem-vindo à nossa comunidade!</p>

        <button onclick="alert('Você curtiu!')">
            ❤️ Curtir
        </button>

        <button onclick="alert('Área de comentários!')">
            💬 Comentar
        </button>
    </div>

    <div class="direita">
        <h2>Você conhece</h2>
       
    </div>

</body>
</html>
