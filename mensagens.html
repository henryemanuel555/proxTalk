<main class="container-fluid area-chat">
        <div class="row g-3">

            <div class="col-4">
                <aside class="painel-contatos">
                    <h2>Contatos</h2>

                    <ul id="lista-contatos" class="lista-contatos">
                        <li class="contato-item ativo" data-contato="Maria Silva" data-status="Online">
                            <span class="contato-nome">Maria Silva</span>
                            <span class="contato-preview">Oi! Você já terminou a parte do CSS?</span>
                        </li>
                        <li class="contato-item" data-contato="João Pedro" data-status="Offline">
                            <span class="contato-nome">João Pedro</span>

                        </li>
                        <li class="contato-item" data-contato="Carla Souza" data-status="Online">
                            <span class="contato-nome">Carla Souza</span>

                        </li>
                    </ul>
                </aside>
            </div>


            <div class="col-8">
                <section class="painel-conversa">
                    <div class="topo-conversa">
                        <h3 id="nome-ativo">Maria Silva</h3>
                        <span id="status-ativo" class="status">Online</span>
                    </div>

                    <div id="caixa-mensagens" class="caixa-mensagens"></div>

                    <form id="form-envio" class="form-envio">
                        <input type="text" id="campo-msg" placeholder="Digite sua mensagem..." required autocomplete="off">
                        <button type="submit">Enviar</button>
                    </form>
                </section>
            </div>
